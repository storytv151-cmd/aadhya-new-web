packages:
  - "apps/*"
  - "packages/*"

# Native-binary dependencies allowed to run install scripts (pnpm 10 blocks these by default).
onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@parcel/watcher"
  - unrs-resolver
  - "@tailwindcss/oxide"

# Shared dependency versions (pnpm catalog) — keep versions in sync across the monorepo.
catalog:
  # Core (Next pinned to 15.4.11 — Payload 3.86 requires >=15.4.11 <15.5.0)
  react: 19.1.1
  react-dom: 19.1.1
  next: 15.4.11
  "@next/eslint-plugin-next": 15.4.11
  typescript: ^5.7.3
  zod: ^3.24.1

  # Motion (the `motion` package is the current name for Framer Motion; import from `motion/react`)
  motion: ^12.0.0
  lenis: ^1.1.18

  # Tooling / types
  "@types/react": 19.1.8
  "@types/react-dom": 19.1.6
  "@types/node": ^22.10.7
